<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2; url=https://shivantra.com/">
  <title>Shivantra</title>
  <link rel="canonical" href="https://shivantra.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap">
  <style>
    body {
      box-sizing: border-box;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 24px 24px max(32px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% 42%, #eeeeff 0, #fafaff 38%, #fff 72%);
      color: #01014f;
      font: 1rem/1.5 Inter, system-ui, sans-serif;
      text-align: center;
    }

    main {
      grid-row: 2;
      width: min(100%, 340px);
    }

    .logo {
      display: block;
      width: 218px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 32px;
      mix-blend-mode: multiply;
    }

    .track {
      width: min(140px, 100%);
      height: 3px;
      margin: 0 auto 28px;
      overflow: hidden;
      border-radius: 10px;
      background: #e0e0ee;
    }

    .track span {
      display: block;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #9292cf, #01014f);
      animation: travel 1.4s ease-in-out infinite;
    }

    .caption {
      margin: 0 0 12px;
      color: #575775;
      font-size: .875rem;
      line-height: 1.6;
    }

    .status {
      margin: 0;
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .continue {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 18px;
      border-radius: 8px;
      background: #01014f;
      color: #fff;
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
    }

    .continue:hover {
      background: #24246e;
    }

    .continue:focus-visible {
      outline: 2px solid #01014f;
      outline-offset: 4px;
    }

    footer {
      grid-row: 3;
      align-self: end;
      padding-top: 24px;
      color: #9292a8;
      font-size: .625rem;
      letter-spacing: .24em;
    }

    @keyframes travel {
      from { transform: translateX(-105%); }
      to { transform: translateX(325%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .track span {
        margin: auto;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/shivantra-logo.svg" width="218" height="80" alt="Shivantra" fetchpriority="high">
    <div class="track" aria-hidden="true"><span></span></div>
    <p class="caption">A little moment. A world of possibilities.</p>
    <p class="status" role="status">Loading your page…</p>
    <a class="continue" href="https://shivantra.com/">Go to shivantra.com</a>
  </main>
  <footer>IDEAS INTO IMPACT</footer>
</body>
</html>
